<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samar Sutar — Sutar Tech</title>
<meta name="description" content="Electrical contractor in Pune.">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#FBF7F1}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  a{color:#5B3FB8}
  #root a[style]:hover{filter:brightness(.96)}
  .sk{max-width:440px;margin:0 auto;padding:38px 20px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .sk i{display:block;background:#EFE7DA;border-radius:8px;animation:p 1.2s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){.sk i{animation:none}}
</style>
</head>
<body>

<main id="root" aria-busy="true">
  <div class="sk">
    <i style="width:96px;height:96px;border-radius:50%"></i>
    <i style="width:180px;height:26px"></i>
    <i style="width:130px;height:14px"></i>
    <i style="width:100%;height:46px"></i>
    <i style="width:100%;height:46px"></i>
  </div>
</main>

<script src="../assets/api.js"></script>
<script src="../assets/common.js"></script>
<script>
  /* ====== the only line that changes per member ====== */
  var SLUG = 'samar';
  /* =================================================== */

  var root = document.getElementById('root');
  var KEY = 'pg_' + SLUG;

  function paint(page) {
    document.body.style.background = ST.theme(page).bg;
    root.innerHTML = ST.renderPage(page, { avatar: 'avatar.jpg' });
    root.setAttribute('aria-busy', 'false');
    var pf = page.profile || {};
    document.title = (pf.name || SLUG) + (pf.headline ? ' — ' + pf.headline : '');
  }

  // 1. instant paint from the last known copy
  try { var c = localStorage.getItem(KEY); if (c) paint(JSON.parse(c)); } catch (e) {}

  // 2. then the fresh copy
  API.publicPage(SLUG).then(function (page) {
    localStorage.setItem(KEY, JSON.stringify(page));
    paint(page);
  }).catch(function (err) {
    if (root.getAttribute('aria-busy') === 'true') {
      root.innerHTML = '<p style="max-width:420px;margin:60px auto;text-align:center;color:#6B6157">'
        + 'This page could not load just now. Please try again.</p>';
      root.setAttribute('aria-busy', 'false');
    }
    console.warn(err);
  });

  // 3. analytics, after paint, never blocking
  addEventListener('load', function () {
    API.track('trackVisit', { slug: SLUG, path: '', ref: document.referrer || '' });
  });
  root.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-tap]');
    if (a) API.track('trackTap', { slug: SLUG, label: a.getAttribute('data-tap') });
  });
</script>
</body>
</html>
